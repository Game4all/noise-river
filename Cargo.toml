[package]
name = "noise-river"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
winit = "0.30.13"
wgpu = { version = "30", features = ["vulkan-portability"] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spirv = "0.4"

[build-dependencies]
build-rs = "0.3"
