[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
winit = "0.30.13"
wgpu = { version = "30", features = ["vulkan-portability"] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spirv = "0.4"
thiserror = "2"
build-rs = "0.3"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"

slang-shady = { path = "crates/slang-shady" }
